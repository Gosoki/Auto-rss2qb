# Alembic 配置。连接串【不写在这里】——本项目是双引擎（配置库恒为本地 SQLite，业务库可切
# SQLite/MySQL），URL 由 db/schema.py 在调用时按引擎注入，故这里留空。
# 平时不用 CLI；真要手动跑：
#   .venv/bin/alembic -x role=data -x url=sqlite:///data/autorss.db upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# 版本号带日期前缀，按文件名排序即时间序，好找
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
